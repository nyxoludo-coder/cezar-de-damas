<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Cezar de Damas — Restaurant syrien oriental à Forest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#0b0b0b;
        --ink:#ede9e1;
        --ink-dim:#a8a299;
        --muted:#7e786e;
        --line:rgba(237,233,225,.13);
        --line-soft:rgba(237,233,225,.08);
        --gold-line:rgba(190,158,92,.55);
        --err:#d69a89;
        --font-serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
        --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      }
      html[lang="ar"]{ --font-serif:"Amiri",serif; }
      html[lang="ar"] .fld-label, html[lang="ar"] .time-group, html[lang="ar"] .code-label,
      html[lang="ar"] .btn, html[lang="ar"] .cat-head h3, html[lang="ar"] .zone h4,
      html[lang="ar"] .info-card h3, html[lang="ar"] .step-dot .lbl, html[lang="ar"] form label,
      html[lang="ar"] .sec-head h2, html[lang="ar"] .hero .tagline{ letter-spacing:0; }
      *{ box-sizing:border-box; }
      html{ scroll-behavior:smooth; }
      body{
        margin:0; background:var(--bg); color:var(--ink);
        font-family:var(--font-sans); font-size:17.5px; line-height:1.6; font-weight:400;
        -webkit-font-smoothing:antialiased;
      }
      h1,h2{ font-family:var(--font-serif); font-weight:500; margin:0; }
      h3{ margin:0; }
      a{ color:var(--ink); }
      button{ font-family:inherit; cursor:pointer; }
      :focus-visible{ outline:1px solid var(--ink); outline-offset:3px; }

      /* ---------- Barre superieure ---------- */
      .topbar{
        position:sticky; top:0; z-index:50;
        background:rgba(11,11,11,.97);
        border-bottom:1px solid var(--line-soft);
      }
      .topbar-in{
        max-width:880px; margin:0 auto; padding:14px 24px;
        display:flex; align-items:center; justify-content:space-between; gap:12px;
      }
      .topbar .brand{
        font-family:var(--font-serif); font-size:19px; font-weight:500; color:var(--ink);
        white-space:nowrap; letter-spacing:.02em;
      }
      .langs{ display:flex; gap:20px; }
      .langs button{
        background:transparent; color:var(--muted);
        border:none; border-bottom:1px solid transparent;
        padding:2px 0 3px; font-size:13px; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
      }
      .langs button:hover{ color:var(--ink); }
      .langs button.active{ color:var(--ink); border-bottom-color:var(--gold-line); }

      .wrap{ max-width:880px; margin:0 auto; padding:0 24px; }

      /* ---------- En-tete ---------- */
      .hero{ text-align:center; padding:88px 24px 76px; max-width:880px; margin:0 auto; }
      .hero .arabic-name{
        font-family:"Amiri",serif; font-size:21px;
        color:var(--ink-dim); margin:0 0 20px; line-height:1.5;
      }
      .hero h1{
        font-size:clamp(42px,8.5vw,60px); line-height:1.08; color:var(--ink); letter-spacing:.01em;
      }
      .hero .tagline{
        margin:20px auto 0; font-size:13px; text-transform:uppercase;
        color:var(--muted); font-weight:500; letter-spacing:.3em;
      }
      .badges{
        display:flex; flex-wrap:wrap; gap:10px 18px; justify-content:center; margin:38px 0 0;
        font-size:15px; color:var(--ink-dim);
      }
      .badge{ display:inline-flex; align-items:center; gap:7px; }
      .badge .star-ic{ color:var(--ink-dim); font-size:13px; }
      .badge.halal{ text-transform:uppercase; letter-spacing:.2em; font-size:12.5px; font-weight:500; color:var(--ink-dim); }
      .hero .address-line{ color:var(--muted); font-size:15px; margin:12px 0 0; }
      .cta-row{ display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:44px; }
      .btn{
        display:inline-block; text-decoration:none; border-radius:0;
        padding:14px 32px; font-size:13px; font-weight:500; letter-spacing:.18em; text-transform:uppercase;
        border:1px solid var(--ink); transition:background .18s ease,color .18s ease,border-color .18s ease; text-align:center;
        background:transparent; color:var(--ink);
      }
      .btn-gold{ background:var(--ink); color:#0b0b0b; }
      .btn-gold:hover{ background:transparent; color:var(--ink); }
      .btn-ghost{ background:transparent; color:var(--ink); border-color:rgba(237,233,225,.35); }
      .btn-ghost:hover{ border-color:var(--ink); }
      .btn[disabled]{ opacity:.4; cursor:not-allowed; }

      /* ---------- Sections ---------- */
      section{ padding:80px 0 8px; }
      .sec-head{ text-align:center; margin-bottom:52px; }
      .sec-head h2{ font-size:clamp(28px,5.5vw,36px); color:var(--ink); letter-spacing:.02em; line-height:1.2; }
      .sec-head h2::after{
        content:""; display:block; width:44px; height:1px;
        background:var(--gold-line); margin:22px auto 0;
      }
      .sec-sub{ text-align:center; color:var(--ink-dim); font-size:16.5px; max-width:540px; margin:18px auto 0; }

      /* ---------- La carte : liste simple ---------- */
      .menu-grid{ display:grid; grid-template-columns:1fr; gap:0; max-width:680px; margin:0 auto; }
      .dish{ padding:17px 0 15px; border-bottom:1px solid var(--line-soft); }
      .dish:last-child{ border-bottom:none; }
      .dish-top{ display:flex; align-items:baseline; gap:12px; }
      .dish-name{ font-family:var(--font-serif); font-size:22px; font-weight:500; color:var(--ink); line-height:1.25; }
      html[lang="ar"] .dish-name{ font-size:20px; }
      .dish-dots{ flex:1; border-bottom:1px dotted rgba(237,233,225,.22); transform:translateY(-5px); min-width:24px; }
      .dish-price{ font-size:16px; color:var(--ink); white-space:nowrap; font-variant-numeric:tabular-nums; }
      .dish-desc{ color:var(--muted); font-size:15.5px; margin-top:3px; max-width:88%; line-height:1.5; }
      .cat{ margin-top:64px; }
      .cat:first-of-type{ margin-top:8px; }
      .cat-head{ text-align:center; margin-bottom:14px; }
      .cat-head h3{
        font-family:var(--font-sans); font-size:13px; font-weight:500; color:var(--ink-dim);
        text-transform:uppercase; letter-spacing:.32em;
      }
      .cat-head::after{
        content:""; display:block; width:28px; height:1px; background:var(--gold-line); margin:16px auto 0;
      }
      .cat-note{
        text-align:center; color:var(--muted); font-family:var(--font-serif); font-style:italic;
        font-size:18px; max-width:560px; margin:4px auto 22px; line-height:1.5;
      }
      html[lang="ar"] .cat-note{ font-style:normal; }
      .poisson-note{
        text-align:center; color:var(--muted); font-family:var(--font-serif); font-style:italic;
        font-size:18px; max-width:560px; margin:0 auto; line-height:1.5;
      }
      html[lang="ar"] .poisson-note{ font-style:normal; }

      /* ---------- Reservation ---------- */
      .booking{
        max-width:640px; margin:0 auto; background:transparent;
        border-top:1px solid var(--line); padding:40px 0 8px;
      }
      .steps{ display:flex; gap:28px; justify-content:center; margin-bottom:44px; flex-wrap:wrap; }
      .step-dot{ text-align:center; }
      .step-dot .bar{ display:none; }
      .step-dot .lbl{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); font-weight:500; padding-bottom:7px; border-bottom:1px solid transparent; }
      .step-dot.on .lbl{ color:var(--ink); border-bottom-color:var(--gold-line); }
      .panel{ display:none; }
      .panel.on{ display:block; }
      .fld-label{ font-size:12.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:500; color:var(--ink-dim); margin:34px 0 13px; }
      .fld-label:first-child{ margin-top:0; }
      .chips{ display:flex; flex-wrap:wrap; gap:8px; }
      .chip{
        background:transparent; color:var(--ink);
        border:1px solid rgba(237,233,225,.22); border-radius:0;
        padding:10px 17px; font-size:16px; font-weight:400; transition:border-color .15s ease,background .15s ease,color .15s ease;
      }
      .chip:hover{ border-color:rgba(237,233,225,.6); }
      .chip.sel{ background:var(--ink); color:#0b0b0b; border-color:var(--ink); font-weight:500; }
      .chip.day{ display:flex; flex-direction:column; align-items:center; gap:0; padding:9px 12px; min-width:80px; }
      .chip.day .dow{ font-size:12px; font-weight:500; text-transform:capitalize; color:var(--muted); }
      .chip.day.sel .dow, .chip.day.sel .dmon{ color:rgba(11,11,11,.6); }
      .chip.day .dnum{ font-family:var(--font-serif); font-size:22px; font-weight:500; line-height:1.25; }
      .chip.day .dmon{ font-size:12px; text-transform:capitalize; color:var(--muted); }
      .time-group{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:22px 0 9px; font-weight:500; }
      .recap{
        border-top:1px solid var(--line); border-bottom:1px solid var(--line);
        padding:13px 0; font-size:16px; color:var(--ink-dim); margin-bottom:4px;
      }
      .recap strong{ color:var(--ink); font-weight:500; }
      .zone{ margin-top:26px; }
      .zone h4{
        font-family:var(--font-sans); font-size:12px; text-transform:uppercase; letter-spacing:.22em;
        color:var(--ink-dim); margin:0 0 12px; font-weight:500;
      }
      .tables{ display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px; }
      .table-btn{
        border:1px solid rgba(237,233,225,.22); border-radius:0;
        background:transparent; color:var(--ink);
        padding:12px 6px 10px; font-size:15.5px; font-weight:500; transition:border-color .15s ease,background .15s ease,color .15s ease;
      }
      .table-btn small{ display:block; font-size:13.5px; font-weight:400; color:var(--muted); margin-top:2px; }
      .table-btn:hover:not([disabled]){ border-color:rgba(237,233,225,.6); }
      .table-btn.sel{ background:var(--ink); color:#0b0b0b; border-color:var(--ink); }
      .table-btn.sel small{ color:rgba(11,11,11,.6); }
      .table-btn[disabled]{ opacity:.35; cursor:not-allowed; }
      .table-btn.taken .tname{ text-decoration:line-through; }
      .table-btn.taken small{ color:var(--err); }
      .legend{ display:flex; flex-wrap:wrap; gap:18px; margin-top:16px; font-size:14px; color:var(--muted); }
      .legend span{ display:inline-flex; align-items:center; gap:8px; }
      .swatch{ width:13px; height:13px; border-radius:0; border:1px solid rgba(237,233,225,.3); background:transparent; display:inline-block; }
      .swatch.taken{ opacity:.35; }
      .swatch.sel{ background:var(--ink); border-color:var(--ink); }
      .hint{ font-size:14.5px; color:var(--muted); margin-top:12px; }
      form .row{ margin-top:20px; }
      form label{ display:block; font-size:12.5px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; margin-bottom:8px; color:var(--ink-dim); }
      form input, form textarea{
        width:100%; background:transparent; color:var(--ink);
        border:1px solid rgba(237,233,225,.22); border-radius:0;
        padding:13px 15px; font-size:17px; font-family:inherit;
      }
      form input:focus, form textarea:focus{ outline:none; border-color:var(--ink); }
      form textarea{ resize:vertical; min-height:76px; }
      .nav-row{ display:flex; gap:12px; margin-top:38px; }
      .nav-row .btn{ flex:1; }
      .btn-back{
        background:transparent; color:var(--ink-dim); border:1px solid rgba(237,233,225,.25);
        border-radius:0; padding:14px 22px; font-size:13px; letter-spacing:.16em; text-transform:uppercase; font-weight:500; flex:0 0 auto !important;
      }
      .btn-back:hover{ border-color:var(--ink); color:var(--ink); }
      .err{
        display:none; margin-top:18px; color:var(--err); font-size:15.5px;
        border:1px solid rgba(214,154,137,.4); background:transparent;
        border-radius:0; padding:11px 15px;
      }
      .err.on{ display:block; }
      /* Confirmation */
      .done{ text-align:center; padding:8px 0 0; }
      .done .check{
        width:58px; height:58px; margin:4px auto 20px; border-radius:50%;
        border:1px solid rgba(237,233,225,.3); display:flex; align-items:center; justify-content:center;
        background:transparent;
      }
      .done .check svg{ width:26px; height:26px; }
      .done h3{ font-family:var(--font-serif); font-size:32px; font-weight:500; color:var(--ink); margin-bottom:10px; }
      .done .thanks{ color:var(--ink-dim); font-size:17px; }
      .done-details{
        text-align:start; max-width:420px; margin:26px auto 0;
        border-top:1px solid var(--line); padding:6px 0;
      }
      .done-details .line{ display:flex; justify-content:space-between; gap:14px; padding:9px 0; font-size:16px; }
      .done-details .line + .line{ border-top:1px solid var(--line-soft); }
      .done-details .k{ color:var(--muted); }
      .done-details .v{ color:var(--ink); font-weight:500; text-align:end; }
      .code-box{
        display:inline-block; margin-top:14px; padding:11px 28px;
        border:1px solid var(--gold-line); border-radius:0;
        font-family:var(--font-serif); font-size:26px; letter-spacing:.16em; color:var(--ink);
        background:transparent;
      }
      .code-label{ font-size:11.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-top:30px; }
      .done .sms{ color:var(--muted); font-size:15.5px; max-width:440px; margin:16px auto 0; }
      .done .btn{ margin-top:28px; }

      /* ---------- Commande en ligne ---------- */
      html[lang="ar"] .add-btn{ letter-spacing:0; }
      .qty-row{ display:flex; align-items:center; gap:12px; margin-top:10px; }
      .add-btn{
        background:transparent; color:var(--ink);
        border:1px solid rgba(237,233,225,.3); border-radius:0;
        padding:8px 22px; font-size:12.5px; font-weight:500; letter-spacing:.16em; text-transform:uppercase;
        transition:border-color .15s ease,background .15s ease,color .15s ease;
      }
      .add-btn:hover{ border-color:var(--ink); }
      .stepper{ display:inline-flex; align-items:center; border:1px solid rgba(237,233,225,.3); }
      .stepper button{
        background:transparent; color:var(--ink); border:none; width:38px; height:38px;
        font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
      }
      .stepper button:hover{ background:rgba(237,233,225,.08); }
      .stepper .qv{ min-width:34px; text-align:center; font-size:16.5px; font-weight:500; font-variant-numeric:tabular-nums; }
      .stepper.small button{ width:32px; height:32px; font-size:17px; }
      .stepper.small .qv{ min-width:28px; font-size:15.5px; }
      .cart{ max-width:640px; margin:56px auto 0; border-top:1px solid var(--line); padding-top:34px; }
      .cart h3{ font-family:var(--font-serif); font-size:26px; font-weight:500; text-align:center; margin:0 0 8px; }
      .cart-empty{ text-align:center; color:var(--muted); font-size:16px; margin:14px 0 4px; }
      .cart-line{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--line-soft); }
      .cart-line .cname{ flex:1; min-width:120px; font-size:16.5px; }
      .cart-line .cprice{ font-size:16px; white-space:nowrap; font-variant-numeric:tabular-nums; min-width:74px; text-align:end; }
      .remove-btn{ background:transparent; border:none; color:var(--muted); font-size:21px; line-height:1; padding:6px; }
      .remove-btn:hover{ color:var(--ink); }
      .cart-total{ display:flex; justify-content:space-between; align-items:baseline; gap:14px; padding:16px 0 4px; font-size:17px; }
      .cart-total .tv{ font-family:var(--font-serif); font-size:25px; font-weight:500; font-variant-numeric:tabular-nums; }
      .mode-chips{ display:flex; gap:8px; flex-wrap:wrap; }

      /* ---------- Infos pratiques ---------- */
      .infos{ max-width:640px; margin:0 auto; }
      .info-card{ border-top:1px solid var(--line); padding:28px 0; }
      .info-card:last-child{ border-bottom:1px solid var(--line); }
      .info-card .ic{ display:none; }
      .info-card h3{
        font-family:var(--font-sans); font-size:12px; text-transform:uppercase; letter-spacing:.22em;
        color:var(--ink-dim); font-weight:500; margin-bottom:9px;
      }
      .info-card p{ margin:0; color:var(--ink); font-size:17px; }
      .info-card .btn{ margin-top:16px; padding:11px 24px; font-size:12px; }
      .svc-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
      .svc-tags span{ border:1px solid rgba(237,233,225,.22); border-radius:0; padding:7px 15px; font-size:15px; color:var(--ink); background:transparent; }

      footer{
        margin-top:88px; border-top:1px solid var(--line-soft);
        padding:38px 24px 46px; text-align:center; color:var(--muted); font-size:14.5px;
      }
      footer .fname{ font-family:"Amiri",serif; color:var(--ink-dim); font-size:18px; display:block; margin-bottom:6px; }
      @media (max-width:520px){
        .topbar .brand{ font-size:16.5px; }
        .langs{ gap:14px; }
        .langs button{ font-size:12px; }
        .hero{ padding:64px 20px 56px; }
        section{ padding:64px 0 8px; }
        .nav-row{ flex-direction:column-reverse; }
        .nav-row .btn, .nav-row .btn-back{ width:100%; flex:none !important; }
        .dish-desc{ max-width:100%; }
      }
      @media (prefers-reduced-motion:reduce){
        html{ scroll-behavior:auto; }
        *{ transition:none !important; }
      }
    </style>
  </head>
  <body>

    <!-- Barre supérieure : sélecteur de langue -->
    <div class="topbar">
      <div class="topbar-in">
        <span class="brand">Cezar de Damas</span>
        <nav class="langs" aria-label="Langue / Language / Taal / اللغة">
          <button type="button" data-lang="fr" class="active">FR</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="nl">NL</button>
          <button type="button" data-lang="ar">عربي</button>
        </nav>
      </div>
    </div>

    <!-- En-tête -->
    <header class="hero">
      <p class="arabic-name" lang="ar" dir="rtl">مطعم قيصر الشام</p>
      <h1>Cezar <span class="de">de</span> Damas</h1>
      <p class="tagline" data-i18n="heroTag"></p>
      <div class="badges">
        <span class="badge"><span class="star-ic" aria-hidden="true">★</span><span data-i18n="rating"></span></span>
        <span class="badge halal" data-i18n="halal"></span>
        <span class="badge">10–20&nbsp;€</span>
      </div>
      <p class="address-line" data-i18n="addressLine"></p>
      <div class="cta-row">
        <a class="btn btn-ghost" href="#carte" data-i18n="ctaMenu"></a>
        <a class="btn btn-ghost" href="#commander" data-i18n="ctaOrder"></a>
        <a class="btn btn-gold" href="#reserver" data-i18n="ctaBook"></a>
      </div>
    </header>


    <main class="wrap">
      <!-- La carte -->
      <section id="carte">
        <div class="sec-head">
          <h2 data-i18n="menuTitle"></h2>
          
        </div>

        <div class="cat">
          <div class="cat-head"><h3 data-i18n="catMezze"></h3></div>
          <div class="menu-grid" id="menu-mezze"></div>
        </div>

        <div class="cat">
          <div class="cat-head"><h3 data-i18n="catPlats"></h3></div>
          <p class="cat-note" data-i18n="garnishNote"></p>
          <div class="menu-grid" id="menu-plats"></div>
        </div>

        <div class="cat">
          <div class="cat-head"><h3 data-i18n="catPoisson"></h3></div>
          <p class="poisson-note" data-i18n="poissonNote"></p>
        </div>
      </section>

      <!-- Réservation -->
      <section id="reserver">
        <div class="sec-head">
          <h2 data-i18n="bookTitle"></h2>
          
          <p class="sec-sub" data-i18n="bookSub"></p>
        </div>

        <div class="booking" id="booking">
          <div class="steps" aria-hidden="true">
            <div class="step-dot on" data-stepdot="1"><div class="bar"></div><div class="lbl" data-i18n="step1Name"></div></div>
            <div class="step-dot" data-stepdot="2"><div class="bar"></div><div class="lbl" data-i18n="step2Name"></div></div>
            <div class="step-dot" data-stepdot="3"><div class="bar"></div><div class="lbl" data-i18n="step3Name"></div></div>
          </div>

          <!-- Étape 1 -->
          <div class="panel on" data-panel="1">
            <p class="fld-label" data-i18n="lblDay"></p>
            <div class="chips" id="days"></div>
            <p class="fld-label" data-i18n="lblTime"></p>
            <div id="times"></div>
            <p class="fld-label" data-i18n="lblGuests"></p>
            <div class="chips" id="guests"></div>
            <p class="err" id="err1"></p>
            <div class="nav-row">
              <button type="button" class="btn btn-gold" id="toStep2" data-i18n="btnContinue"></button>
            </div>
          </div>

          <!-- Étape 2 -->
          <div class="panel" data-panel="2">
            <div class="recap" id="recap"></div>

        garnishNote:"تُقدَّم أطباقنا مع متبّل ومسبّحة وسلطة وبطاطا مقلية وصلصة — ما لم يُذكَر خلاف ذلك.",
        poissonNote:"قائمة السمك في الطريق — اسألوا عنها في المطعم.",
        bookTitle:"احجز طاولة",
        bookSub:"اختر اليوم والوقت، بل وحتى طاولتك. تأكيد فوري.",
        step1Name:"اليوم والوقت",
        step2Name:"الطاولة والبيانات",
        step3Name:"التأكيد",
        lblDay:"أيّ يوم؟",
        lblTime:"في أيّ وقت؟",
        lblGuests:"كم عدد الأشخاص؟",
        midi:"الغداء",
        soir:"العشاء",
        btnContinue:"متابعة",
        btnBack:"رجوع",
        btnConfirm:"تأكيد الحجز",
        btnAgain:"حجز آخر",
        recapDay:"اليوم", recapTime:"الوقت", recapGuests:"الأشخاص",
        lblTable:"اختر طاولتك",
        zoneTerrasse:"الشرفة",
        zoneFenetre:"بجانب النافذة",
        zoneCalme:"القاعة الهادئة",
        tableWord:"طاولة",
        legendFree:"متاحة",
        legendTaken:"محجوزة",
        legendYours:"طاولتك",
        takenWord:"محجوزة",
        capNote:"الطاولات المشطوبة محجوزة مسبقًا. والطاولات الرمادية أصغر من حجم مجموعتكم.",
        lblName:"اسمكم الكامل",
        lblPhone:"رقم الهاتف",
        lblEmail:"البريد الإلكتروني (اختياري)",
        lblSpecial:"طلب خاص (حساسية، مناسبة، كرسي أطفال…)",
        errStep1:"اختر اليوم والوقت وعدد الأشخاص للمتابعة.",
        errTable:"اختر طاولة متاحة على المخطط.",
        errForm:"أدخل الاسم ورقم هاتف صحيحًا.",
        errEmail:"يبدو أن عنوان البريد الإلكتروني غير صحيح — صحّحوه أو اتركوا الحقل فارغًا.",
        doneTitle:"تمّ الحجز!",
        doneThanks:"شكرًا {name}! طاولتكم بانتظاركم في قيصر الشام.",
        dDate:"التاريخ", dTime:"الوقت", dTable:"الطاولة", dGuests:"الأشخاص", dName:"الاسم",
        codeLabel:"رمز التأكيد",
        smsNote:"احتفظوا بهذا الرمز. التأكيد في الطريق إليكم برسالة نصية وبريد إلكتروني (عرض تجريبي).",
        infosTitle:"معلومات عملية",
        lblAddress:"العنوان",
        directions:"الاتجاهات",
        lblHours:"ساعات العمل",
        hoursText:"مفتوح كل يوم اعتبارًا من الساعة 12:00",
        lblServices:"الخدمات",
        svcTakeaway:"طلبات خارجية",
        svcDelivery:"توصيل",
        footerLine:"Cezar de Damas · Avenue Wielemans Ceuppens 25, 1190 Forest, Bruxelles",
        ctaOrder:"اطلب عبر الإنترنت",
        orderTitle:"الطلب عبر الإنترنت",
        orderSub:"اختر أطباقك — للطلبات الخارجية أو التوصيل.",
        addBtn:"أضف",
        cartTitle:"طلبكم",
        cartEmpty:"سلّتكم فارغة. أضيفوا طبقًا للبدء.",
        modeLabel:"طلبات خارجية أم توصيل؟",
        totalLabel:"المجموع",
        removeLabel:"إزالة هذا الطبق",
        btnOrderConfirm:"تأكيد الطلب",
        errCartEmpty:"أضيفوا طبقًا واحدًا على الأقل إلى طلبكم.",
        orderDoneTitle:"تمّ استلام الطلب!",
        orderDoneThanks:"شكرًا {name}! طلبكم قيد التحضير في قيصر الشام.",
        dMode:"طريقة الاستلام",
        orderCodeLabel:"رمز الطلب",
        demoNote:"نسخة تجريبية: لا يُرسَل هذا الطلب فعليًا إلى المطعم.",
        btnNewOrder:"طلب جديد",
        guestsWord:function(n){
          if (n === 1) return "شخص واحد";
          if (n === 2) return "شخصان";
          return n + " أشخاص";
        },
        seatsWord:function(n){ return n + (n === 2 ? " مقعدان" : " مقاعد"); }
      }
    };

    var LOCALES = { fr:"fr-BE", en:"en-GB", nl:"nl-BE", ar:"ar" };
    var lang = "fr";
    function t(){ return I18N[lang]; }

    /* ================= Plan des tables ================= */
    var ZONES = [
      { key:"zoneTerrasse", tables:[["T1",2],["T2",4],["T3",2],["T4",6]] },
      { key:"zoneFenetre",  tables:[["F1",2],["F2",4],["F3",4],["F4",2]] },
      { key:"zoneCalme",    tables:[["S1",4],["S2",6],["S3",2],["S4",4]] }
    ];
    var TIMES_MIDI = ["12:00","12:30","13:00","13:30"];
    var TIMES_SOIR = ["19:00","19:30","20:00","20:30","21:00"];

    var state = { dateIdx:null, dateObj:null, time:null, guests:null, table:null, tableZone:null, code:null };

    function pad(n){ return (n < 10 ? "0" : "") + n; }
    function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
    function hashStr(s){ var h = 0; for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; } return h; }
    function isTaken(tableId){
      if (!state.dateObj || !state.time) return false;
      var h = hashStr(dateKey(state.dateObj) + "|" + state.time + "|" + tableId);
      return (h % 3) === 0;
    }
    function fmtDate(d){
      try {
        return new Intl.DateTimeFormat(LOCALES[lang], { weekday:"long", day:"numeric", month:"long" }).format(d);
      } catch(e){ return d.toLocaleDateString(); }
    }
    function esc(s){
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    /* ================= Rendu : carte ================= */
    function renderMenu(){
      ["mezze","plats"].forEach(function(cat){
        var box = document.getElementById("menu-" + cat);
        box.innerHTML = "";
        MENU[cat].forEach(function(d){
          var div = document.createElement("div");
          div.className = "dish";
          var desc = d.desc ? d.desc[lang] : "";
          div.innerHTML =
            '<div class="dish-top"><span class="dish-name">' + esc(d.name) + '</span>' +
            '<span class="dish-dots"></span><span class="dish-price">' + esc(d.price) + '</span></div>' +
            (desc ? '<div class="dish-desc">' + esc(desc) + '</div>' : "");
          box.appendChild(div);
        });
      });
    }

    /* ================= Rendu : étape 1 ================= */
    function buildDays(){
      var box = document.getElementById("days");
      box.innerHTML = "";
      var now = new Date();
      for (var i = 0; i < 7; i++){
        (function(i){
          var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i);
          var dow = "", num = "", mon = "";
          try {
            dow = new Intl.DateTimeFormat(LOCALES[lang], { weekday:"short" }).format(d).replace(/\.$/,"");
            num = new Intl.DateTimeFormat(LOCALES[lang], { day:"numeric" }).format(d);
            mon = new Intl.DateTimeFormat(LOCALES[lang], { month:"short" }).format(d).replace(/\.$/,"");
          } catch(e){ num = d.getDate(); }
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip day" + (state.dateIdx === i ? " sel" : "");
          b.innerHTML = '<span class="dow">' + esc(dow) + '</span><span class="dnum">' + esc(num) + '</span><span class="dmon">' + esc(mon) + '</span>';
          b.addEventListener("click", function(){
            state.dateIdx = i; state.dateObj = d; state.table = null; state.tableZone = null;
            buildDays(); hideErr("err1");
          });
          box.appendChild(b);
        })(i);
      }
    }
    function buildTimes(){
      var box = document.getElementById("times");
      box.innerHTML = "";
      [["midi", TIMES_MIDI], ["soir", TIMES_SOIR]].forEach(function(group){
        var label = document.createElement("p");
        label.className = "time-group";
        label.textContent = t()[group[0]];
        box.appendChild(label);
        var chips = document.createElement("div");
        chips.className = "chips";
        group[1].forEach(function(tm){
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (state.time === tm ? " sel" : "");
          b.textContent = tm;
          b.setAttribute("dir","ltr");
          b.addEventListener("click", function(){
            state.time = tm; state.table = null; state.tableZone = null;
            buildTimes(); hideErr("err1");
          });
          chips.appendChild(b);
        });
        box.appendChild(chips);
      });
    }
    function buildGuests(){
      var box = document.getElementById("guests");
      box.innerHTML = "";
      for (var n = 1; n <= 8; n++){
        (function(n){
          var b = document.createElement("button");
          b.type = "button";
          b.className = "chip" + (state.guests === n ? " sel" : "");
          b.textContent = t().guestsWord(n);
          b.addEventListener("click", function(){
            state.guests = n;
            if (state.table){
              var cap = tableCapacity(state.table);
              if (cap && cap < n){ state.table = null; state.tableZone = null; }
            }
            buildGuests(); hideErr("err1");
          });
          box.appendChild(b);
        })(n);
      }
    }
    function tableCapacity(id){
      for (var z = 0; z < ZONES.length; z++){
        for (var i = 0; i < ZONES[z].tables.length; i++){
          if (ZONES[z].tables[i][0] === id) return ZONES[z].tables[i][1];
        }
      }
      return null;
    }

    /* ================= Rendu : étape 2 ================= */
    function renderRecap(){
      var box = document.getElementById("recap");
      box.innerHTML =
        "<strong>" + esc(fmtDate(state.dateObj)) + "</strong> · " +
        '<span dir="ltr">' + esc(state.time) + "</span> · " +
        esc(t().guestsWord(state.guests));
    }
    function buildPlan(){
      var box = document.getElementById("plan");
      box.innerHTML = "";
      ZONES.forEach(function(zone){
        var wrap = document.createElement("div");
        wrap.className = "zone";
        var h = document.createElement("h4");
        h.textContent = t()[zone.key];
        wrap.appendChild(h);
        var grid = document.createElement("div");
        grid.className = "tables";
        zone.tables.forEach(function(tb){
          var id = tb[0], cap = tb[1];
          var taken = isTaken(id);
          var tooSmall = state.guests && cap < state.guests;
          var b = document.createElement("button");
          b.type = "button";
          b.className = "table-btn" + (taken ? " taken" : "") + (state.table === id ? " sel" : "");
          b.disabled = taken || !!tooSmall;
          b.innerHTML = '<span class="tname">' + esc(t().tableWord) + " " + esc(id) + "</span>" +
            "<small>" + (taken ? esc(t().takenWord) : esc(t().seatsWord(cap))) + "</small>";
          if (!b.disabled){
            b.addEventListener("click", function(){
              state.table = id; state.tableZone = zone.key;
              buildPlan(); hideErr("err2");
            });
          }
          grid.appendChild(b);
        });
        wrap.appendChild(grid);
        box.appendChild(wrap);
      });
    }

    /* ================= Navigation entre étapes ================= */
    function showStep(n){
      [1,2,3].forEach(function(i){
        document.querySelector('[data-panel="' + i + '"]').classList.toggle("on", i === n);
        document.querySelector('[data-stepdot="' + i + '"]').classList.toggle("on", i <= n);
      });
      var bk = document.getElementById("booking");
      if (bk) bk.scrollIntoView({ behavior:"smooth", block:"start" });
    }
    function showErr(id, msg){
      var e = document.getElementById(id);
      e.textContent = msg; e.classList.add("on");
    }
    function hideErr(id){ document.getElementById(id).classList.remove("on"); }

    document.getElementById("toStep2").addEventListener("click", function(){
      if (state.dateIdx === null || !state.time || !state.guests){
        showErr("err1", t().errStep1); return;
      }
      hideErr("err1");
      renderRecap();
      buildPlan();
      showStep(2);
    });
    document.getElementById("backTo1").addEventListener("click", function(){ showStep(1); });

    document.getElementById("confirmBtn").addEventListener("click", function(){
      if (!state.table){ showErr("err2", t().errTable); return; }
      var name = document.getElementById("fName").value.trim();
      var phone = document.getElementById("fPhone").value.replace(/[\s.\-()]/g, "");
      var email = document.getElementById("fEmail").value.trim();
      if (name.length < 2 || !/^\+?\d{8,15}$/.test(phone)){ showErr("err2", t().errForm); return; }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showErr("err2", t().errEmail); return; }
      hideErr("err2");
      state.code = "RES-" + (1000 + Math.floor(Math.random() * 9000));
      renderDone(name);
      showStep(3);
    });

    function renderDone(name){
      document.getElementById("doneThanks").textContent = t().doneThanks.replace("{name}", name);
      var rows = [
        [t().dName, name],
        [t().dDate, fmtDate(state.dateObj)],
        [t().dTime, state.time],
        [t().dTable, t()[state.tableZone] + " · " + t().tableWord + " " + state.table],
        [t().dGuests, t().guestsWord(state.guests)]
      ];
      var box = document.getElementById("doneDetails");
      box.innerHTML = "";
      rows.forEach(function(r){
        var line = document.createElement("div");
        line.className = "line";
        var v = r[0] === t().dTime ? '<span class="v" dir="ltr">' + esc(r[1]) + "</span>"
                                   : '<span class="v">' + esc(r[1]) + "</span>";
        line.innerHTML = '<span class="k">' + esc(r[0]) + "</span>" + v;
        box.appendChild(line);
      });
      document.getElementById("doneCode").textContent = state.code;
    }

    document.getElementById("againBtn").addEventListener("click", function(){
      state = { dateIdx:null, dateObj:null, time:null, guests:null, table:null, tableZone:null, code:null };
      ["fName","fPhone","fEmail","fNote"].forEach(function(id){ document.getElementById(id).value = ""; });
      buildDays(); buildTimes(); buildGuests();
      hideErr("err1"); hideErr("err2");
      showStep(1);
    });

    /* ================= Commande en ligne ================= */
    var orderState = { cart:{}, mode:"takeaway", code:null, lastName:"" };

    function priceOf(d){
      return parseFloat(String(d.price).replace(/\s/g, "").replace("€", "").replace(",", ".")) || 0;
    }
    function fmtPrice(n){ return n.toFixed(2).replace(".", ",") + " €"; }
    function dishKey(cat, i){ return cat + "-" + i; }
    function cartCount(){
      var s = 0;
      for (var k in orderState.cart) s += orderState.cart[k];
      return s;
    }
    function cartTotal(){
      var s = 0;
      ["mezze","plats"].forEach(function(cat){
        MENU[cat].forEach(function(d, i){
          s += (orderState.cart[dishKey(cat, i)] || 0) * priceOf(d);
        });
      });
      return s;
    }
    function changeQty(key, delta){
      var q = (orderState.cart[key] || 0) + delta;
      if (q <= 0) delete orderState.cart[key];
      else orderState.cart[key] = q;
      renderOrder(); renderCart();
    }
    function makeStepper(key, small){
      var st = document.createElement("div");
      st.className = "stepper" + (small ? " small" : "");
      var minus = document.createElement("button");
      minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "−");
      minus.addEventListener("click", function(){ changeQty(key, -1); });
      var qv = document.createElement("span");
      qv.className = "qv"; qv.textContent = orderState.cart[key] || 0;
      var plus = document.createElement("button");
      plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "+");
      plus.addEventListener("click", function(){ changeQty(key, 1); });
      st.appendChild(minus); st.appendChild(qv); st.appendChild(plus);
      return st;
    }
    function renderOrder(){
      ["mezze","plats"].forEach(function(cat){
        var box = document.getElementById("order-" + cat);
        box.innerHTML = "";
        MENU[cat].forEach(function(d, i){
          var key = dishKey(cat, i);
          var q = orderState.cart[key] || 0;
          var div = document.createElement("div");
          div.className = "dish";
          var desc = d.desc ? d.desc[lang] : "";
          div.innerHTML =
            '<div class="dish-top"><span class="dish-name">' + esc(d.name) + '</span>' +
            '<span class="dish-dots"></span><span class="dish-price">' + esc(d.price) + '</span></div>' +
            (desc ? '<div class="dish-desc">' + esc(desc) + '</div>' : "");
          var row = document.createElement("div");
          row.className = "qty-row";
          if (q === 0){
            var b = document.createElement("button");
            b.type = "button"; b.className = "add-btn"; b.textContent = t().addBtn;
            b.addEventListener("click", function(){
              orderState.cart[key] = 1;
              renderOrder(); renderCart();
            });
            row.appendChild(b);
          } else {
            row.appendChild(makeStepper(key, false));
          }
          div.appendChild(row);
          box.appendChild(div);
        });
      });
    }
    function renderMode(){
      var box = document.getElementById("modeChips");
      box.innerHTML = "";
      [["takeaway", t().svcTakeaway], ["delivery", t().svcDelivery]].forEach(function(m){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (orderState.mode === m[0] ? " sel" : "");
        b.textContent = m[1];
        b.addEventListener("click", function(){ orderState.mode = m[0]; renderMode(); });
        box.appendChild(b);
      });
    }
    function renderCart(){
      var lines = document.getElementById("cartLines");
      lines.innerHTML = "";
      var has = cartCount() > 0;
      document.getElementById("cartEmpty").style.display = has ? "none" : "";
      document.getElementById("cartTotal").style.display = has ? "" : "none";
      ["mezze","plats"].forEach(function(cat){
        MENU[cat].forEach(function(d, i){
          var key = dishKey(cat, i);
          var q = orderState.cart[key] || 0;
          if (!q) return;
          var line = document.createElement("div");
          line.className = "cart-line";
          var nm = document.createElement("span");
          nm.className = "cname"; nm.textContent = d.name;
          var pr = document.createElement("span");
          pr.className = "cprice"; pr.textContent = fmtPrice(q * priceOf(d));
          var rm = document.createElement("button");
          rm.type = "button"; rm.className = "remove-btn"; rm.textContent = "×";
          rm.setAttribute("aria-label", t().removeLabel);
          rm.addEventListener("click", function(){
            delete orderState.cart[key];
            renderOrder(); renderCart();
          });
          line.appendChild(nm);
          line.appendChild(makeStepper(key, true));
          line.appendChild(pr);
          line.appendChild(rm);
          lines.appendChild(line);
        });
      });
      document.getElementById("cartTotalVal").textContent = fmtPrice(cartTotal());
      renderMode();
    }
    function renderOrderDone(){
      document.getElementById("orderDoneThanks").textContent =
        t().orderDoneThanks.replace("{name}", orderState.lastName);
      var box = document.getElementById("orderDoneDetails");
      box.innerHTML = "";
      var rows = [];
      ["mezze","plats"].forEach(function(cat){
        MENU[cat].forEach(function(d, i){
          var q = orderState.cart[dishKey(cat, i)] || 0;
          if (q) rows.push([d.name + " × " + q, fmtPrice(q * priceOf(d))]);
        });
      });
      rows.push([t().dMode, orderState.mode === "delivery" ? t().svcDelivery : t().svcTakeaway]);
      rows.push([t().totalLabel, fmtPrice(cartTotal())]);
      rows.push([t().dName, orderState.lastName]);
      rows.forEach(function(r){
        var line = document.createElement("div");
        line.className = "line";
        line.innerHTML = '<span class="k">' + esc(r[0]) + '</span><span class="v">' + esc(r[1]) + "</span>";
        box.appendChild(line);
      });
      document.getElementById("orderDoneCode").textContent = orderState.code;
    }

    document.getElementById("orderConfirmBtn").addEventListener("click", function(){
      if (cartCount() === 0){ showErr("errOrder", t().errCartEmpty); return; }
      var name = document.getElementById("oName").value.trim();
      var phone = document.getElementById("oPhone").value.replace(/[\s.\-()]/g, "");
      var email = document.getElementById("oEmail").value.trim();
      if (name.length < 2 || !/^\+?\d{8,15}$/.test(phone)){ showErr("errOrder", t().errForm); return; }
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showErr("errOrder", t().errEmail); return; }
      hideErr("errOrder");
      orderState.code = "CMD-" + (1000 + Math.floor(Math.random() * 9000));
      orderState.lastName = name;
      renderOrderDone();
      document.getElementById("orderMain").style.display = "none";
      document.getElementById("orderDone").style.display = "";
      document.getElementById("commander").scrollIntoView({ behavior:"smooth", block:"start" });
    });

    document.getElementById("newOrderBtn").addEventListener("click", function(){
      orderState.cart = {}; orderState.code = null; orderState.lastName = "";
      ["oName","oPhone","oEmail"].forEach(function(id){ document.getElementById(id).value = ""; });
      hideErr("errOrder");
      document.getElementById("orderDone").style.display = "none";
      document.getElementById("orderMain").style.display = "";
      renderOrder(); renderCart();
      document.getElementById("commander").scrollIntoView({ behavior:"smooth", block:"start" });
    });

    /* ================= Changement de langue ================= */
    function applyLang(next){
      lang = next;
      var html = document.documentElement;
      html.setAttribute("lang", lang);
      html.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");
      document.title = t().docTitle;
      document.querySelectorAll("[data-i18n]").forEach(function(el){
        var key = el.getAttribute("data-i18n");
        if (t()[key]) el.textContent = t()[key];
      });
      document.querySelectorAll(".langs button").forEach(function(b){
        b.classList.toggle("active", b.getAttribute("data-lang") === lang);
      });
      renderMenu();
      renderOrder(); renderCart();
      if (orderState.code) renderOrderDone();
      buildDays(); buildTimes(); buildGuests();
      if (state.dateObj && state.time && state.guests){ renderRecap(); buildPlan(); }
    }
    document.querySelectorAll(".langs button").forEach(function(b){
      b.addEventListener("click", function(){ applyLang(b.getAttribute("data-lang")); });
    });

    applyLang("fr");
    </script>
  </body>
</html>
